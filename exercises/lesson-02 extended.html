<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      function ProductDetails({ product, price, discountPrice, imgSrc }){
        return (
          <div>
            <img src={imgSrc} width="100" />
            <p>{product}</p>
            {discountPrice ? (
              <>
                <p><del>Price: ${price}</del></p>
                <p>Discount price: ${discountPrice}</p>
              </>
            ) : (
              <p>Price: ${price}</p>
            )}
            <button>Add to cart</button>
            </div>
        );
      }

      function App(){
        return (
          <>
            <ProductDetails
              imgSrc="cotton-socks.png"
              product="Cotton socks" 
              price="10.90"
              discountPrice="5.45"
            />
            <ProductDetails
              imgSrc="tennis-balls.png"
              product="Tennis balls" 
              price="6.00" 
            />
            <ProductDetails
              imgSrc="plain-t-shirt.png"
              product="Plain T-Shirts" 
              price="7.99" 
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
